# Review these declarations before applying them on an occupied node.
# The independent roots and approval markers are intentionally NOT created here.
d /var/lib/bloch-products 0711 root root -
d /var/lib/bloch-products/data 0700 bloch-data bloch-data -
d /var/lib/bloch-products/pay 0700 bloch-pay bloch-pay -
# Authenticated admission uses separate persistent state/cursor paths. An empty
# directory after prior use is an incident, never bootstrap authorization.
d /var/lib/bloch-products/data/state 0700 bloch-data bloch-data -
d /var/lib/bloch-products/data/cursor 0700 bloch-data bloch-data -
d /var/lib/bloch-products/pay/state 0700 bloch-pay bloch-pay -
d /var/lib/bloch-products/pay/cursor 0700 bloch-pay bloch-pay -
# Coordination is boot-scoped and must exist before operational acquisition.
d /run/bloch-products 0711 root root -
d /run/bloch-products/data 0700 bloch-data bloch-data -
d /run/bloch-products/data/coord 0700 bloch-data bloch-data -
f /run/bloch-products/data/coord/.local-state.coordination.lock 0600 bloch-data bloch-data -
d /run/bloch-products/pay 0700 bloch-pay bloch-pay -
d /run/bloch-products/pay/coord 0700 bloch-pay bloch-pay -
f /run/bloch-products/pay/coord/.local-state.coordination.lock 0600 bloch-pay bloch-pay -
d /etc/bloch-products 0711 root root -
d /etc/bloch-products/roots 0711 root root -
d /etc/bloch-products/approvals 0711 root root -
