[workspace]
members = [
  "crates/bloch-authenticated-transport-evidence",
  "crates/bloch-data-governance",
  "crates/bloch-indexer-audit",
  "crates/bloch-indexer-audit-retention",
  "crates/bloch-indexer-core",
  "crates/bloch-indexer-delivery-protocol",
  "crates/bloch-indexer-delivery-transport",
  "crates/bloch-indexer-delivery-worker",
  "crates/bloch-indexer-receipt-ack",
  "crates/bloch-indexer-receiver-core",
  "crates/bloch-indexer-service-admission",
  "crates/bloch-indexer-input",
  "crates/bloch-indexer-protocol",
  "crates/bloch-indexer-query",
  "crates/bloch-local-state-store",
  "crates/bloch-local-state-checkpoint",
  "crates/bloch-local-state-admission",
  "crates/bloch-local-state-cursor",
  "crates/bloch-local-state-rebootstrap",
  "crates/bloch-local-state-remote-cursor",
  "crates/bloch-local-state-remote-cursor-challenge-store",
  "crates/bloch-local-state-remote-cursor-caller-auth",
  "crates/bloch-local-state-remote-cursor-control-plane",
  "crates/bloch-local-state-remote-cursor-receipt-staging",
  "crates/bloch-local-state-remote-cursor-replica-quorum",
  "crates/bloch-local-state-remote-session",
  "crates/bloch-trusted-time",
  "crates/bloch-trusted-time-boundary-store",
  "crates/bloch-trusted-time-external-anchor",
  "crates/bloch-trusted-time-session",
  "crates/bloch-local-state-runtime",
  "crates/bloch-local-state-transition",
  "crates/bloch-local-state-coordination",
  "crates/bloch-pay-reconciliation",
  "crates/bloch-pay-allocation-store",
  "crates/bloch-pay-adjustments",
  "crates/bloch-verify-core",
  "crates/bloch-verify-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4.3"
libc = "0.2.180"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
