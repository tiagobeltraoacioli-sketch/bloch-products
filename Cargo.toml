[workspace]
members = [
  "crates/bloch-data-governance",
  "crates/bloch-indexer-audit",
  "crates/bloch-indexer-audit-retention",
  "crates/bloch-indexer-core",
  "crates/bloch-indexer-delivery-protocol",
  "crates/bloch-indexer-delivery-transport",
  "crates/bloch-indexer-delivery-worker",
  "crates/bloch-indexer-receipt-ack",
  "crates/bloch-indexer-receiver-core",
  "crates/bloch-indexer-service-admission",
  "crates/bloch-indexer-input",
  "crates/bloch-indexer-protocol",
  "crates/bloch-indexer-query",
  "crates/bloch-pay-reconciliation",
  "crates/bloch-verify-core",
  "crates/bloch-verify-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4.3"
libc = "0.2.180"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
